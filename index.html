<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebAR Card Video Tutorial</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>

    <a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- 1. Đổi từ thẻ <img> sang thẻ <video> -->
        <!-- Thêm các thuộc tính: preload, response-type, loop, autoplay, muted, playsinline -->
        <video id="ar-video" src="./assets/vua_su_tu_ Final.mp4" preload="auto" response-type="arraybuffer" loop crossorigin="webkit-playsinline" playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 2. Lắng nghe sự kiện targetFound / targetLost để tự động phát/dừng video khi quét trúng Marker -->
      <a-entity mindar-image-target="targetIndex: 0" id="target">
        
        <!-- Áp dụng video texture lên mặt phẳng (a-plane) -->
        <a-plane src="#ar-video" position="0 0 0" height="0.55" width="1" rotation="0 0 0"></a-plane>
        
        <a-text value="Chao mung den voi AR!" color="black" align="center" position="0 -0.35 0" scale="0.5 0.5 0.5"></a-text>
      </a-entity>
      
    </a-scene>

    <!-- 3. Script bổ trợ giúp điều khiển video chạy khi camera nhận diện được marker -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const target = document.querySelector("#target");
        const video = document.querySelector("#ar-video");

        // Khi quét trúng ảnh (Marker xuất hiện) -> Phát video
        target.addEventListener("targetFound", event => {
          video.play();
        });

        // Khi mất dấu ảnh (Ra khỏi khung hình) -> Tạm dừng video
        target.addEventListener("targetLost", event => {
          video.pause();
        });
      });
    </script>
  </body>
</html>
