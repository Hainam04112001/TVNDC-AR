<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebAR Video Fix</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      /* Style cho nút bấm mở đầu để lách chính sách chặn video của trình duyệt */
      #startButton {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: sans-serif;
        cursor: pointer;
      }
      #startButton div {
        background: #ff4757;
        padding: 15px 30px;
        border-radius: 30px;
        font-size: 20px;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
      }
    </style>
  </head>
  <body>

    <!-- Lớp phủ bắt buộc chạm màn hình để bật video -->
    <div id="startButton" onclick="startAR()">
      <div style="margin-bottom: 15px;">👉 Bấm vào đây để bắt đầu AR</div>
      <p style="font-size: 14px; color: #ccc;">(Giúp kích hoạt video chạy trên điện thoại)</p>
    </div>

    <a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Thêm thuộc tính muted và playsinline để tránh bị chặn trên iOS -->
        <video id="ar-video" src="./assets/vua_su_tu_ Final.mp4" preload="auto" response-type="arraybuffer" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target">
        <a-plane src="#ar-video" position="0 0 0" height="0.55" width="1" rotation="0 0 0"></a-plane>
        <a-text value="Chao mung den voi AR!" color="black" align="center" position="0 -0.35 0" scale="0.5 0.5 0.5"></a-text>
      </a-entity>
      
    </a-scene>

    <script>
      function startAR() {
        // Ẩn màn hình nút bấm đi
        document.querySelector("#startButton").style.display = 'none';
        
        // Kích hoạt load trước video bằng cách ép chạy ngầm rồi pause ngay lập tức
        const video = document.querySelector("#ar-video");
        video.play().then(() => {
          video.pause();
          video.currentTime = 0;
        }).catch(e => {
          console.log("Video init error:", e);
        });
      }

      document.addEventListener("DOMContentLoaded", function() {
        const target = document.querySelector("#target");
        const video = document.querySelector("#ar-video");

        // Khi quét trúng ảnh -> Phát video từ đầu
        target.addEventListener("targetFound", event => {
          video.play();
        });

        // Khi mất dấu ảnh -> Tạm dừng video
        target.addEventListener("targetLost", event => {
          video.pause();
        });
      });
    </script>
  </body>
</html>
