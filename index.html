<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebAR Card Tutorial</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>

    <a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>

        <img id="card-img" src="./assets/vua_su_tu_ Final.mp4" />
      </a-assets>


      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>


      <a-entity mindar-image-target="targetIndex: 0">

        <a-plane src="#card-img" position="0 0 0" height="0.55" width="1" rotation="0 0 0"></a-plane>
        

        <a-text value="Chao mung den voi AR!" color="black" align="center" position="0 -0.35 0" scale="0.5 0.5 0.5"></a-text>
      </a-entity>
      
    </a-scene>
  </body>
</html>
