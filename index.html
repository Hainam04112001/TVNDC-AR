<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trải nghiệm thực tế ảo AR - Thư viện Nguyễn Đình Chiểu Vĩnh Long</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body { font-family: Arial, Helvetica, sans-serif; }

.ar-screen {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

.poster, .logo-circle {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  user-select: none;
  -webkit-user-drag: none;
}

.poster {
  z-index: 1;
  pointer-events: none;
}

.logo-circle {
  z-index: 4;
  pointer-events: none;
  transform-origin: 50% 47%;
  animation: logoZoom 4.8s ease-in-out infinite;
}

@keyframes logoZoom {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.035); }
}

#particles {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 5;
  pointer-events: none;
}

.ar-start {
  position: absolute;
  left: 50%;
  bottom: 15%;
  transform: translateX(-50%);
  width: 80px;
  height: 80px;
  border: 2px solid rgba(255, 255, 255, .9);
  border-radius: 50%;
  background: rgba(255, 255, 255, .12);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  z-index: 10;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(255, 255, 255, .35), 0 0 35px rgba(0, 200, 255, .25);
  animation: buttonPulse 2s infinite ease-in-out;
}

.ar-start::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-35%, -50%);
  width: 0;
  height: 0;
  border-top: 13px solid transparent;
  border-bottom: 13px solid transparent;
  border-left: 20px solid white;
}

@keyframes buttonPulse {
  0%, 100% { transform: translateX(-50%) scale(1); }
  50% { transform: translateX(-50%) scale(1.08); }
}

.hint {
  position: absolute;
  left: 50%;
  bottom: 7%;
  transform: translateX(-50%);
  z-index: 10;
  color: #fff;
  font-size: 16px;
  text-align: center;
  white-space: nowrap;
  text-shadow: 0 1px 4px rgba(0, 0, 0, .8), 0 0 10px rgba(0, 200, 255, .4);
  animation: hintGlow 2s infinite ease-in-out;
}

@keyframes hintGlow {
  0%, 100% { opacity: .65; }
  50% { opacity: 1; }
}

@media(max-width: 600px) {
  .ar-start { width: 70px; height: 70px; bottom: 16%; }
  .hint { font-size: 14px; bottom: 8%; }
}
</style>
</head>
<body>

<main class="ar-screen" aria-label="Giao diện trải nghiệm AR của thư viện">
  <!-- Canvas chứa hiệu ứng hạt (particles) động phía sau -->
  <canvas id="particles"></canvas>

  <!-- Các lớp hình ảnh với mã Base64 đầy đủ -->
  <!-- Poster nền (Bạn có thể thay thế chuỗi base64 mẫu bên dưới bằng chuỗi base64 của poster thật nếu cần) -->
  <img class="poster" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=" alt="Poster AR Thư viện">
  
  <!-- Logo vòng tròn (Bạn có thể thay thế chuỗi base64 mẫu bên dưới bằng chuỗi base64 của logo thật nếu cần) -->
  <img class="logo-circle" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" alt="Logo Vòng Tròn AR">

  <!-- Nút kích hoạt trải nghiệm AR -->
  <button class="ar-start" aria-label="Bắt đầu trải nghiệm AR"></button>

  <!-- Dòng chữ hướng dẫn người dùng -->
  <div class="hint">Chạm để bắt đầu trải nghiệm AR</div>
</main>

<script>
  // Xử lý hiệu ứng hạt (Particles) cho canvas
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const particlesArray = [];
  const numberOfParticles = 50;

  class Particle {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 2 + 1;
      this.speedX = Math.random() * 0.6 - 0.3;
      this.speedY = Math.random() * 0.6 - 0.3;
      this.opacity = Math.random() * 0.5 + 0.2;
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      if (this.x < 0) this.x = canvas.width;
      if (this.x > canvas.width) this.x = 0;
      if (this.y < 0) this.y = canvas.height;
      if (this.y > canvas.height) this.y = 0;
    }
    draw() {
      ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function initParticles() {
    for (let i = 0; i < numberOfParticles; i++) {
      particlesArray.push(new Particle());
    }
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particlesArray.forEach(particle => {
      particle.update();
      particle.draw();
    });
    requestAnimationFrame(animateParticles);
  }

  initParticles();
  animateParticles();

  // Sự kiện khi nhấn nút bắt đầu AR
  document.querySelector('.ar-start').addEventListener('click', () => {
    console.log("Đã kích hoạt nút trải nghiệm AR!");
    // Thêm các logic chuyển hướng hoặc bật WebXR / AR viewer tại đây nếu có
  });
</script>

</body>
</html>
