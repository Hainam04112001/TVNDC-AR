<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Trải nghiệm thực tế ảo AR - Thư viện Nguyễn Đình Chiểu Vĩnh Long</title>

    <!-- Thư viện A-Frame và MindAR -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, Helvetica, sans-serif;
      }

      /* Khung bao bọc chuẩn tỷ lệ 9:16 tối ưu cho màn hình điện thoại */
      .ar-viewport {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        max-width: 56.25vh; /* Giữ tỷ lệ 9:16 trên màn hình rộng */
        left: 50%;
        transform: translateX(-50%);
        overflow: hidden;
      }

      /* Lớp phủ màn hình bắt đầu (Landing Screen) đúng theo ảnh mẫu */
      #startButton {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: #89D1F5; /* Màu nền xanh dương sáng giống trong ảnh */
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        z-index: 9999;
        padding: 35px 20px;
        text-align: center;
        cursor: pointer;
        transition: opacity 0.4s ease;
      }

      /* Phần thông tin cơ quan và thư viện ở phía trên */
      .header-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      .agency-name {
        font-size: 13px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #2c3e50;
        margin-bottom: 4px;
      }

      .library-name {
        font-size: 14px;
        font-weight: bold;
        text-transform: uppercase;
        color: #2c3e50;
      }

      /* Tiêu đề AR ở giữa */
      .ar-main-title {
        font-size: 26px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #D32F2F; /* Màu đỏ nổi bật giống trong ảnh */
        line-height: 1.3;
        margin: 10px 0;
      }

      /* Logo liên kết bằng đường link trong folder code */
      .logo-container {
        width: 160px;
        height: 160px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: auto 0;
      }

      .logo-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      /* Nút bấm phía dưới màn hình chuẩn như ảnh yêu cầu */
      #actionButtonBox {
        background: #3B4CCA; /* Màu xanh đậm của nút bấm giống ảnh */
        border-radius: 12px;
        padding: 14px 20px;
        width: 100%;
        max-width: 330px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        margin-bottom: 10px;
      }

      #actionButtonBox .main-btn-text {
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 4px;
        color: #ffffff;
      }

      #actionButtonBox .sub-btn-text {
        font-size: 12px;
        color: #e0e0e0;
      }

      /* Ẩn scene AR ban đầu để tránh bật camera ngầm */
      #ar-scene-container {
        display: none;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>

    <div class="ar-viewport">
      <!-- Lớp phủ màn hình bắt đầu (Landing Screen) theo thiết kế mới -->
      <div id="startButton" onclick="startAR()">
        <!-- Phần phía trên: Tên cơ quan và Thư viện -->
        <div class="header-section">
          <div class="agency-name">SỞ VĂN HÓA, THỂ THAO VÀ DU LỊCH TỈNH VĨNH LONG</div>
          <div class="library-name">THƯ VIỆN NGUYỄN ĐÌNH CHIỂU VĨNH LONG</div>
        </div>

        <!-- Tiêu đề giữa -->
        <div class="ar-main-title">
          TRẢI NGHIỆM<br>THỰC TẾ ẢO AR
        </div>

        <!-- Logo lấy từ đường link trong folder code (Thay 'logo.png' bằng tên file ảnh thực tế của bạn) -->
        <div class="logo-container">
          <img src="assets/logo-thuvien.png" alt="Logo Thư Viện">
        </div>

        <!-- Nút bấm tương tác ở dưới -->
        <div id="actionButtonBox">
          <div class="main-btn-text">Bấm vào đây để trải nghiệm AR</div>
          <div class="sub-btn-text">(giúp kích hoạt video và camera điện thoại)</div>
        </div>
      </div>

      <!-- Khởi tạo Scene AR (Sẽ hiển thị sau khi bấm nút) -->
      <div id="ar-scene-container">
        <a-scene id="main-scene" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
          
          <a-assets>
            <video id="ar-video" src="./assets/vua_su_tu_Final.mp4" preload="auto" response-type="arraybuffer" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
          </a-assets>

          <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

          <a-entity id="target">
            <a-plane id="video-plane" src="#ar-video" position="0 0 0" height="0.55" width="1" rotation="0 0 0"></a-plane>
          </a-entity>
          
        </a-scene>
      </div>
    </div>

    <script>
      function startAR() {
        // Ẩn màn hình chờ
        const startButton = document.querySelector("#startButton");
        startButton.style.opacity = '0';
        setTimeout(() => {
          startButton.style.display = 'none';
        }, 400);

        // Hiển thị khung chứa AR scene
        const sceneContainer = document.querySelector("#ar-scene-container");
        sceneContainer.style.display = 'block';

        // Kích hoạt thuộc tính mindar-image cho a-scene để bắt đầu bật camera quét
        const sceneEl = document.querySelector("#main-scene");
        sceneEl.setAttribute('mindar-image', 'imageTargetSrc: targets.mind;');

        // Xử lý sự kiện video và tương tác target sau khi scene được load
        sceneEl.addEventListener('loaded', function() {
          const target = document.querySelector("#target");
          const video = document.querySelector("#ar-video");
          const plane = document.querySelector("#video-plane");

          // Gán component mindar-image-target vào entity sau khi khởi động
          target.setAttribute('mindar-image-target', 'targetIndex: 0');

          // Kích hoạt sẵn video
          video.play().then(() => {
            video.pause();
            video.currentTime = 0;
          }).catch(e => {
            console.log("Video init error:", e);
          });

          // Tự động điều chỉnh kích thước a-plane theo tỷ lệ video
          video.addEventListener('loadedmetadata', function() {
            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;
            
            if (videoWidth && videoHeight) {
              const aspectRatio = videoWidth / videoHeight;
              if (videoHeight > videoWidth) {
                plane.setAttribute('height', 1);
                plane.setAttribute('width', aspectRatio);
              } else {
                const heightRatio = videoHeight / videoWidth;
                plane.setAttribute('width', 1);
                plane.setAttribute('height', heightRatio);
              }
            }
          });

          // Khi quét trúng marker
          target.addEventListener("targetFound", event => {
            video.play();
          });

          // Khi mất dấu marker
          target.addEventListener("targetLost", event => {
            video.pause();
          });
        });
      }
    </script>
  </body>
</html>
