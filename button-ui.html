<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Button UI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;font-family:Arial,Helvetica,sans-serif;overflow:hidden}

/* STYLE CHO NÚT BẮT ĐẦU AR */
#startButton {
  position: absolute;
  left: 50%;
  bottom: 12%;
  transform: translateX(-50%);
  cursor: pointer;
  text-align: center;
  color: #ffffff;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  padding: 16px 24px;
  border-radius: 20px;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), 0 0 20px rgba(0, 200, 255, 0.3);
  animation: buttonPulse 2s infinite ease-in-out;
  user-select: none;
  max-width: 90vw;
  width: 320px;
}

#startButton:active {
  transform: translateX(-50%) scale(0.95);
}

.btn-title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 6px;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-sub {
  font-size: 12px;
  color: #dddddd;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
  margin: 0;
}

@keyframes buttonPulse {
  0%, 100% {
    transform: translateX(-50%) scale(1);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), 0 0 15px rgba(0, 200, 255, 0.3);
  }
  50% {
    transform: translateX(-50%) scale(1.04);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), 0 0 25px rgba(0, 200, 255, 0.6);
  }
}

@media(max-width:600px){
  #startButton {
    width: 280px;
    padding: 14px 20px;
    bottom: 10%;
  }
  .btn-title { font-size: 15px; }
  .btn-sub { font-size: 11px; }
}
</style>
</head>
<body>

  <div id="startButton" onclick="triggerAR()">
    <div class="btn-title">👉 Bấm vào đây để bắt đầu AR</div>
    <p class="btn-sub">(Giúp kích hoạt video và camera trên điện thoại)</p>
  </div>

<script>
  function triggerAR() {
    // Gửi thông báo ra file index.html chính để chạy hàm AR
    window.parent.postMessage("START_AR", "*");
  }
</script>

</body>
</html>
